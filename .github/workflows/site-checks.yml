name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shared page parts are up to date
        run: python3 scripts/sync_site.py --check
      - name: Links, anchors, images, headings, SEO and sitemap
        run: python3 scripts/check_site.py
