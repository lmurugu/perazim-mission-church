name: Content feed

on:
  pull_request:
    paths: ["data/**", "scripts/build_data.py", "**/*.html"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/build_data.py", "**/*.html"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feed is valid and pages are up to date
        run: python3 scripts/build_data.py --check
